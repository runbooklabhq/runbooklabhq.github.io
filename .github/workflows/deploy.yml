# Runbook Lab site: unpacks site-source.zip, builds with MkDocs and deploys to GitHub Pages (runbooklabhq.com).
# To update the site, replace site-source.zip in the repo root (Striker runs do this).
name: Deploy site
on:
  push:
    branches: [main]
    paths:
      - site-source.zip
      - .github/workflows/deploy.yml
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"   # daily rebuild so dates and RSS stay fresh
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the site source
        run: mkdir src && unzip -q site-source.zip -d src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned tools
        working-directory: src
        run: pip install -r requirements.txt
      - name: Generate pages
        working-directory: src
        run: python gen.py data
      - name: Build (strict)
        working-directory: src
        run: mkdocs build --strict -d ../_site
        env:
          RL_CF_BEACON: ${{ vars.RL_CF_BEACON }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
